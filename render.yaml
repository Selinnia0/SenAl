# Render Blueprint: https://render.com/docs/blueprint-spec
# Ücretsiz plan: Docker web servisi + PostgreSQL. Solid Queue (eskalasyon her dakika, boşluk
# raporu her gün 08:00) Puma'nın içinde çalışır; ayrı worker servisi gerekmez.
databases:
  - name: senal-db
    plan: free
    region: frankfurt
    databaseName: senal
    user: senal
    postgresMajorVersion: "16" # CI'daki production işi PostgreSQL 16 ile test ediyor
    ipAllowList: [] # yalnızca Render içinden erişim

services:
  - type: web
    name: senal
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Entrypoint açıkça çağrılır: Render dockerCommand ile imajın ENTRYPOINT'ini ezse de ezmese de
    # db:prepare (+ SEED_ON_BOOT=1 ise db:seed) sunucudan önce bir kez çalışır. Önceki sürümde
    # dockerCommand "./bin/rails server" idi ve hazırlık atlandı (solid_queue_recurring_tasks yok).
    dockerCommand: ./bin/docker-entrypoint ./bin/rails server
    healthCheckPath: /up
    # main'e her push'ta, GitHub'daki CI kontrolleri geçerse deploy et.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: senal-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: PORT # Render'ın varsayılanı; Puma 0.0.0.0:$PORT dinler
        value: "10000"
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
      - key: SEED_ON_BOOT
        value: "1"
      - key: TIME_SKIP_ENABLED
        value: "1"
      - key: RAILS_LOG_LEVEL
        value: info
